<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A professional interactive form with JavaScript validation."
    >

    <meta name="author" content="Codveda Front-End Internship">

    <title>Interactive Registration Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="page">

        <section class="form-container">

            <div class="form-header">

                <p class="subtitle">
                    CREATE YOUR ACCOUNT
                </p>

                <h1>
                    Get Started
                </h1>

                <p>
                    Fill in the information below to create your account.
                </p>

            </div>


            <form id="registration-form" novalidate>


                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                    >

                    <small
                        class="error-message"
                        id="name-error"
                    ></small>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                    >

                    <small
                        class="error-message"
                        id="email-error"
                    ></small>

                </div>


                <!-- Phone -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                    >

                    <small
                        class="error-message"
                        id="phone-error"
                    ></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                    >

                    <small
                        class="password-hint"
                    >
                        Use at least 8 characters with uppercase,
                        lowercase and a number.
                    </small>

                    <small
                        class="error-message"
                        id="password-error"
                    ></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        name="confirm-password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                    >

                    <small
                        class="error-message"
                        id="confirm-password-error"
                    ></small>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="submit-button"
                >
                    Create Account
                </button>


                <!-- Success Message -->

                <div
                    class="success-message"
                    id="success-message"
                    role="alert"
                >
                    Account created successfully!
                </div>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
